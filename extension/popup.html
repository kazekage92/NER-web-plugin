<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NER Entity Labeler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      font-size: 13px;
    }
    header {
      padding: 14px 16px 10px;
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
    }
    header h1 { font-size: 14px; font-weight: 700; color: #a0aec0; letter-spacing: 0.5px; }
    header p  { font-size: 11px; color: #556; margin-top: 2px; }

    section { padding: 12px 16px; border-bottom: 1px solid #1e1e3a; }
    h2 { font-size: 11px; font-weight: 700; color: #667; text-transform: uppercase;
         letter-spacing: 0.8px; margin-bottom: 8px; }

    .entity-list { display: flex; flex-direction: column; gap: 5px; }
    .entity-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px; background: #1a1a2e; border-radius: 6px;
    }
    .entity-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .entity-name { flex: 1; font-weight: 600; font-size: 12px; }
    .btn-remove {
      background: none; border: none; color: #556; cursor: pointer;
      font-size: 14px; line-height: 1; padding: 0 2px;
    }
    .btn-remove:hover { color: #e74c3c; }

    .add-row { display: flex; gap: 6px; margin-top: 8px; }
    .add-row input[type=text] {
      flex: 1; padding: 6px 8px; background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 5px; color: #e0e0f0; font-size: 12px; outline: none;
    }
    .add-row input[type=text]::placeholder { color: #445; }
    .add-row input[type=color] {
      width: 32px; height: 30px; border: none; background: none; cursor: pointer; padding: 0;
    }
    .btn-add {
      padding: 6px 10px; background: #3d5af1; color: #fff; border: none;
      border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-add:hover { background: #2d4ad1; }

    .stat { font-size: 12px; color: #aaa; }
    .stat span { font-weight: 700; color: #e0e0f0; }

    .btn-export {
      width: 100%; padding: 9px; background: #2ecc71; color: #000;
      border: none; border-radius: 6px; font-size: 13px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
    }
    .btn-export:hover { background: #27ae60; }
    .btn-clear-all {
      width: 100%; padding: 7px; background: #1a1a2e; color: #e74c3c;
      border: 1px solid #e74c3c33; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    .btn-clear-all:hover { background: #e74c3c22; }
    .btn-rescan {
      width: 100%; padding: 8px; background: #1a1a2e; color: #3498db;
      border: 1px solid #3498db55; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    .btn-rescan:hover { background: #3498db22; }

    .empty { color: #445; font-size: 12px; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>NER Entity Labeler</h1>
    <p>Select text on any page to label entities</p>
  </header>

  <section>
    <h2>Entity Types</h2>
    <div class="entity-list" id="entity-list"></div>
    <div class="add-row" style="margin-top:8px">
      <input type="text" id="new-name" placeholder="e.g. PRODUCT" maxlength="20"/>
      <input type="color" id="new-color" value="#e67e22" title="Pick color"/>
      <button class="btn-add" id="btn-add">Add</button>
    </div>
  </section>

  <section>
    <h2>Annotations</h2>
    <p class="stat" id="stat">Loading…</p>
    <button class="btn-export" id="btn-export">Export JSON</button>
    <button class="btn-rescan"    id="btn-rescan">Re-scan Page</button>
    <button class="btn-clear-all" id="btn-clear">Clear All Highlights</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
